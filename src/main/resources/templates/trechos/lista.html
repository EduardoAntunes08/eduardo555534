<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trechos de calçada</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>
<body>

<div th:replace="~{fragments/layout :: menu}"></div>

<h1>Trechos de calçada</h1>

<div th:replace="~{fragments/layout :: mensagens}"></div>

<p><a th:href="@{/trechos/novo}">Novo trecho</a></p>

<table>
    <thead>
    <tr>
        <th>Logradouro</th>
        <th>Bairro</th>
        <th>Tipo</th>
        <th>Altitude (m)</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="t : ${trechos}">
        <td th:text="${t.logradouro}"></td>
        <td th:text="${t.bairroNome}"></td>
        <td th:text="${t.tipoCalcada}"></td>
        <td th:text="${t.altitude}"></td>
        <td class="acoes">
            <a th:href="@{/trechos/{id}/editar(id=${t.id})}">Editar</a>
            <form th:action="@{/trechos/{id}/excluir(id=${t.id})}" method="post">
                <button type="submit">Excluir</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(trechos)}">
        <td colspan="5">Nenhum trecho cadastrado.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
