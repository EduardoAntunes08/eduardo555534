spring.application.name=eduardo555534
server.port=8080

# ---------- Oracle da FIAP ----------
# Substitua USUARIO e SENHA pelos valores do arquivo credenciais.txt
spring.datasource.url=jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL
spring.datasource.username=USUARIO
spring.datasource.password=SENHA
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ---------- JPA / Hibernate ----------
# as tres tabelas (GS534_BAIRRO, GS534_TRECHO, GS534_LEITURA) sao criadas pelo JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ---------- Parametros da prova (RM 555534) ----------
# P1 = prefixo das tabelas = GS534  (555534 % 1000 = 534)
# P2 = limiar de alerta L = 10 + 2 * (555534 % 4) = 10 + 2 * 2 = 14 cm
app.limiar-alerta=14

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
